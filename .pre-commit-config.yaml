ci:
  autoupdate_schedule: quarterly
  skip: [pip-compile, phpcbf, phpcs]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: pip-compile
        name: pip-compile requirements_dev.in
        args: [requirements_dev.in, -o, requirements_dev.txt]
        files: ^requirements_dev\.(in|txt)$
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
      - id: sqlfluff-fix
  - repo: local
    hooks:
      - id: phpcbf
        name: phpcbf
        entry: vendor/bin/phpcbf
        language: system
        types: [php]
      - id: phpcs
        name: phpcs
        entry: vendor/bin/phpcs
        language: system
        types: [php]

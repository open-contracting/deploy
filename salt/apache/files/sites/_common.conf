{#- https://github.com/icing/mod_md#readme -#}
{#- Without additional configuration, mod_md can only acquire certificates if port 80 is open. -#}
{%- set ssl = pillar.apache.get('public_access') and https -%}
{#- MDRequireHttps requires a virtual host on port 80. -#}
{%- set ports = [80, 443] if ssl else [80] -%}

{%- macro address(port) -%}
{{ pillar.apache.ipv4 if 'ipv4' in pillar.apache else '*' }}:{{ port }}{% if 'ipv6' in pillar.apache %} [{{ pillar.apache.ipv6 }}]:{{ port }}{% endif %}
{%- endmacro -%}

{%- macro tls() %}
    SSLEngine on
    {#- https://github.com/icing/mod_md#tls-alpn-challenges #}
    Protocols h2 http/1.1 acme-tls/1
{%- endmacro -%}

{#- `servername` is not set for the default site. -#}
{%- if ssl and servername -%}
<MDomain {{ ([servername] + serveraliases)|join(' ') }}>
    MDRequireHttps permanent
</MDomain>
{%- endif %}

{%- for port in ports %}

<VirtualHost {{ address(port) }}>
    {%- if servername %}
    ServerName {{ servername }}
    {%- endif %}
    {#- On port 443, the aliases have their own virtual host. #}
    {%- if port == 80 %}
    {%- for serveralias in serveraliases %}
    ServerAlias {{ serveralias }}
    {%- endfor %}
    {%- endif %}

    {%- if port == 443 %}
    {{- tls() }}

    {#- System-wide configuration files should be prefixed with numbers #}
    {%- if pillar.apache.get('site_logs') and not filename[:1].isdigit() %}

    ErrorLog  /var/log/apache2/{{ filename }}/error.log
    CustomLog /var/log/apache2/{{ filename }}/access.log vhost_combined
    {%- endif %}

    Include {{ includefile }}
    {%- elif not servername %}

    RewriteEngine on
    RewriteRule ^ https://{{ grains.fqdn }}%{REQUEST_URI} [R=301,L]
    {%- elif not ssl %}

    Include {{ includefile }}
    {%- endif %}
</VirtualHost>
{%- if port == 80 and ssl and serveraliases %}

<VirtualHost {{ address(443) }}>
    ServerName {{ serveraliases[0] }}
    {%- for serveralias in serveraliases[1:] %}
    ServerAlias {{ serveralias }}
    {%- endfor %}
    {{- tls() }}

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    RewriteEngine on
    RewriteRule ^ https://{{ servername }}%{REQUEST_URI} [R=301,L]
</VirtualHost>
{%- endif %}
{%- endfor %}

<IfModule md_module>
    MDContactEmail sysadmin@open-contracting.org
    MDCertificateAgreement accepted
    MDCAChallenges http-01
{% if grains.osmajorrelease|int >= 26 %}
    MDStoreDir /var/lib/apache2/md
{% endif %}
{%- for directive, value in salt['pillar.get']('apache:modules:mod_md', {})|items %}
    {{ directive }} {{ value }}
{%- endfor %}
</IfModule>

<IfModule ssl_module>
{%- if grains.osmajorrelease|int >= 26 %}
    # generated 2026-08-06, TLSRef Guideline v6.0, Apache 2.4.66, OpenSSL 3.5.5, intermediate config, gitrev=1b22dc6
    # https://configurator.tlsref.org/#server=apache&version=2.4.66&config=intermediate&openssl=3.5.5&guideline=6.0
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLOpenSSLConfCmd       Curves X25519MLKEM768:X25519:prime256v1:secp384r1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLCipherSuite          TLSv1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
{%- else %}
    # generated 2026-08-06, TLSRef Guideline v6.0, Apache 2.4.52, OpenSSL 3.0.2 (OLD: missing PQC hybrid MLKEMs), intermediate config, gitrev=1b22dc6
    # https://configurator.tlsref.org/#server=apache&version=2.4.52&config=intermediate&openssl=3.0.2&guideline=6.0
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLCipherSuite          TLSv1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
{%- endif %}
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
</IfModule>
